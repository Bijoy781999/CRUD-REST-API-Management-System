<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD API</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <form id="crud-form" name="CRUDform" method="post" action="/api/items">
            <table border="1" class="tab">
                <th colspan="2">CRUD API Form</th>
                <tr>
                    <td class="key">Name:</td>
                    <td class="val"><input type="text" id="name" name="Name" placeholder="Full Name" value="" required></td>
                </tr>

                <tr>
                    <td class="key">Email:</td>
                    <td class="val"><input type="text" id="email" name="Email" placeholder="someone@example.com" value="" required></td>
                </tr>

                <tr>
                    <td class="key">Phone Number:</td>
                    <td class="val"><input type="text" id="phN" name="Phone" placeholder="Phone Number" value="" required></td>
                </tr>

                <tr align="center">
                    <td colspan="2" class="btn"><button type="submit" name="submit" id="sBtn">Submit<span class="material-symbols-outlined">send_and_archive</span></button></td>
                </tr>
            </table>
        </form>
    </div>
    
    <div id="display"></div>

    <script src="script.js"></script>
</body>
</html>
